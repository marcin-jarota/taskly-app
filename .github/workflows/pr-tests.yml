name: PR tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  baseline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: node --test '.claude/skills/gate-unit-tests/scripts/*.test.mjs'
        working-directory: .

  test-keeper:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.action == 'opened' && !github.event.pull_request.draft) ||
        github.event.action == 'ready_for_review' ||
        (github.event.action == 'labeled' && github.event.label.name == 'test-keeper')
      )
    runs-on: ubuntu-latest
    environment: test-keeper
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      TEST_KEEPER_OUT: .test-keeper
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p "$TEST_KEEPER_OUT"
          git diff --name-only "origin/${BASE_REF}...HEAD" > "$TEST_KEEPER_OUT/changed.txt"
          if grep -qE '^(backend|frontend)/src/' "$TEST_KEEPER_OUT/changed.txt"; then
            echo source=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.source == 'true'
        run: npm --prefix backend ci
      - if: steps.changed.outputs.source == 'true'
        run: npm --prefix frontend ci

      - id: agent
        if: steps.changed.outputs.source == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Run for this pull request. The changed files are in .test-keeper/changed.txt, the out dir is .test-keeper.
          claude_args: |
            --agent unit-test-keeper
            --model ${{ vars.TEST_KEEPER_MODEL || 'claude-sonnet-5-5' }}
            --effort medium
            --max-budget-usd 3
            --permission-mode dontAsk
            --allowedTools "Read(backend/**),Read(frontend/**),Read(.claude/**),Read(.test-keeper/**),Read(CLAUDE.md),Glob,Grep,Skill,Edit(backend/tests/**),Edit(frontend/src/**/*.test.ts),Edit(frontend/src/**/*.test.tsx),Edit(frontend/src/test/**),Edit(.test-keeper/**),Bash(env -u ANTHROPIC_API_KEY -u GITHUB_TOKEN npm --prefix backend run test *),Bash(env -u ANTHROPIC_API_KEY -u GITHUB_TOKEN npm --prefix backend run test:coverage),Bash(env -u ANTHROPIC_API_KEY -u GITHUB_TOKEN npm --prefix frontend run test *),Bash(env -u ANTHROPIC_API_KEY -u GITHUB_TOKEN npm --prefix frontend run test:coverage),Bash(npm --prefix backend run typecheck),Bash(npm --prefix frontend run typecheck),Bash(node .claude/skills/gate-unit-tests/scripts/mutate.mjs *),Bash(git diff *),Bash(git merge-base *),Bash(git log *),Bash(git show *),Bash(git status *),Bash(git ls-files *)"

      - id: publish
        if: steps.changed.outputs.source == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/test-keeper-publish.sh

      - if: steps.publish.outputs.sha != ''
        env:
          PAT: ${{ secrets.TEST_KEEPER_PAT }}
          HEAD_REF: ${{ github.head_ref }}
        run: git push "https://x-access-token:${PAT}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"

      - id: comment
        if: steps.changed.outputs.source == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EXECUTION_FILE: ${{ steps.agent.outputs.execution_file }}
          STATUS: ${{ steps.publish.outputs.status }}
          SHA: ${{ steps.publish.outputs.sha }}
        run: |
          read -r cost tokens out turns < <(jq -r '
            [.[] | select(.type == "result")] | last
            | if . == null then "0 0 0 0"
              else "\(.total_cost_usd) \(.usage | .input_tokens + .cache_creation_input_tokens + .cache_read_input_tokens + .output_tokens) \(.usage.output_tokens) \(.num_turns)"
              end' "${EXECUTION_FILE:-/dev/null}" 2>/dev/null || echo "0 0 0 0") || true
          read -r pcost ptokens pruns < <(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate -q '.[].body' 2>/dev/null \
            | grep -o '<!-- test-keeper-totals [^>]* -->' | tail -1 \
            | sed -E 's/.*cost=([0-9.]+) tokens=([0-9]+) runs=([0-9]+).*/\1 \2 \3/') || true
          read -r tcost ttokens truns < <(jq -nr --argjson c "$cost" --argjson t "$tokens" --argjson pc "${pcost:-0}" --argjson pt "${ptokens:-0}" --argjson pr "${pruns:-0}" \
            '"\($c + $pc) \($t + $pt) \($pr + 1)"')
          k() { jq -nr --argjson n "$1" 'if $n >= 1000 then "\($n / 100 | round / 10)k" else "\($n)" end'; }
          money() { jq -nr --argjson n "$1" '"$\($n * 100 | round / 100)"'; }
          run_line="💸 $(money "$cost") · 🔢 $(k "$tokens") tokens (out $(k "$out")) · 🔁 $turns turns"
          total_line=""
          [ "$truns" -gt 1 ] && total_line="Total over $truns runs: 💸 $(money "$tcost") · 🔢 $(k "$ttokens") tokens"
          {
            echo "## Unit test keeper"
            echo "**${STATUS}** · ${run_line} · ${SHA:+commit }${SHA:-no commit}"
            [ -n "$total_line" ] && echo "$total_line"
            echo
            if [ -s "$TEST_KEEPER_OUT/report.md" ]; then cat "$TEST_KEEPER_OUT/report.md"; else echo "The agent wrote no report."; fi
            if [ -s "$TEST_KEEPER_OUT/reverted.txt" ]; then
              echo; echo "### Reverted by CI"
              sed 's/^/- `/; s/$/`/' "$TEST_KEEPER_OUT/reverted.txt"
            fi
            echo; echo "Add the \`test-keeper\` label to run the agent again."
            echo "<!-- test-keeper-totals cost=$tcost tokens=$ttokens runs=$truns -->"
          } > "$TEST_KEEPER_OUT/comment.md"
          if grep -qE 'sk-ant-|ghp_|github_pat_' "$TEST_KEEPER_OUT/comment.md"; then
            echo "comment looks like it holds a secret, not posting"; exit 1
          fi

      - if: steps.changed.outputs.source == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: test-keeper
          path: .test-keeper/comment.md

      - if: github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --remove-label test-keeper --repo ${{ github.repository }} || true
